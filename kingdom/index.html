<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KINGDOM GROUP — Real Estate, Housing & Infrastructure</title>
    <link rel="icon" type="image/png" href="/images/brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('kingdom-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch {}
      })();
    </script>
  </head>
  <body class="bg-[#F9F9F8] text-[#141518] antialiased transition-colors duration-200 selection:bg-[#18191D] selection:text-white dark:bg-[#0C0D0F] dark:text-[#F4F3F0] dark:selection:bg-[#C9A46B] dark:selection:text-[#0C0D0F]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
